name: FlightParticles
description: $description
prefix: Fly
version: '${version}'

main: mc.jonomore.flightParticles.FlightParticles
api-version: '26.3'
load: POSTWORLD
softdepend: [ LuckPerms ]

authors: [ Jonomore ]

# Bukkit treats undeclared permissions as PermissionDefault.OP, so every node
# below keeps `op` to preserve current behavior. Flip the cosmetic ones to
# `false` if ops should not implicitly own every particle.
permissions:
  lobby.flight:
    description: Allows flight outside creative and spectator.
    default: op
  flight.command:
    description: Access to /flightparticle.
    default: op
  flight.command.resetall:
    description: Access to /flightparticle reset --all.
    default: op
  flight.settings:
    description: Allows tuning a particle's settings instead of using its defaults.
    default: op
  flight.particle.*:
    description: Use every flight trail particle. Each particle's node is registered from config.yml.
    default: op
  flight.*:
    description: Full access to FlightParticles.
    default: op
    children:
      flight.command: true
      flight.command.resetall: true
      flight.settings: true
      flight.particle.*: true
